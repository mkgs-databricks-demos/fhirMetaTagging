<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" font-family="Consolas, monospace" font-size="11">
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#888"/>
    </marker>
  </defs>
  <rect width="700" height="380" fill="#111" rx="8"/>

  <!-- Bundle 1 -->
  <rect x="20" y="20" width="300" height="200" rx="6" fill="#07a" fill-opacity="0.15" stroke="#07a" stroke-width="2"/>
  <text x="170" y="42" fill="#07a" text-anchor="middle" font-weight="bold" font-size="13">Bundle 1: paratus-pha-pipeline</text>
  <text x="170" y="58" fill="#8bcae7" text-anchor="middle" font-size="9">Infrastructure — deploy first</text>

  <rect x="35" y="70" width="120" height="22" rx="3" fill="#333" stroke="#07a"/>
  <text x="95" y="85" fill="#8bcae7" text-anchor="middle" font-size="9">schema.yml</text>

  <rect x="165" y="70" width="120" height="22" rx="3" fill="#333" stroke="#07a"/>
  <text x="225" y="85" fill="#8bcae7" text-anchor="middle" font-size="9">volumes.yml</text>

  <rect x="35" y="100" width="250" height="22" rx="3" fill="#333" stroke="#07a"/>
  <text x="160" y="115" fill="#8bcae7" text-anchor="middle" font-size="9">pipeline.yml (SDP — 9 SQL + 1 Python)</text>

  <rect x="35" y="130" width="250" height="22" rx="3" fill="#333" stroke="#07a"/>
  <text x="160" y="145" fill="#8bcae7" text-anchor="middle" font-size="9">notebooks (explore, ABAC, ndjson write)</text>

  <rect x="35" y="160" width="250" height="22" rx="3" fill="#333" stroke="#07a"/>
  <text x="160" y="175" fill="#8bcae7" text-anchor="middle" font-size="9">fixtures (templates, requirements)</text>

  <text x="170" y="205" fill="#07a" text-anchor="middle" font-size="9">dab deploy -t dev → creates schema, volumes, pipeline</text>

  <!-- Arrow: Bundle 1 → Schema -->
  <line x1="320" y1="120" x2="378" y2="120" stroke="#888" stroke-width="2" marker-end="url(#ah)"/>

  <!-- Schema box -->
  <rect x="380" y="50" width="140" height="140" rx="6" fill="#333" stroke="#888"/>
  <text x="450" y="72" fill="#fff" text-anchor="middle" font-weight="bold" font-size="11">paratus.pha_pipeline</text>
  <text x="390" y="92" fill="#0a6" font-size="9">• gold_validated_resources</text>
  <text x="390" y="108" fill="#07a" font-size="9">• gold_resource_elements</text>
  <text x="390" y="124" fill="#ccc" font-size="9">• mv_pipeline_kpis</text>
  <text x="390" y="140" fill="#ccc" font-size="9">• mv_tag_distribution</text>
  <text x="390" y="156" fill="#ccc" font-size="9">• mv_rule1_ai_provider</text>
  <text x="390" y="172" fill="#ccc" font-size="9">• mv_bundle_completeness</text>

  <!-- Dependency arrow -->
  <text x="450" y="210" fill="#c00" text-anchor="middle" font-weight="bold" font-size="10">tables must exist ↓</text>

  <!-- Bundle 2 -->
  <rect x="20" y="230" width="300" height="130" rx="6" fill="#0a6" fill-opacity="0.15" stroke="#0a6" stroke-width="2"/>
  <text x="170" y="252" fill="#0a6" text-anchor="middle" font-weight="bold" font-size="13">Bundle 2: paratus-pha-experience</text>
  <text x="170" y="268" fill="#cfc" text-anchor="middle" font-size="9">Experience Layer — deploy second</text>

  <rect x="35" y="280" width="250" height="22" rx="3" fill="#333" stroke="#0a6"/>
  <text x="160" y="295" fill="#cfc" text-anchor="middle" font-size="9">dashboard.yml (serialized_dashboard inline)</text>

  <rect x="35" y="310" width="250" height="22" rx="3" fill="#333" stroke="#0a6"/>
  <text x="160" y="325" fill="#cfc" text-anchor="middle" font-size="9">genie.yml (serialized_space inline)</text>

  <text x="170" y="355" fill="#0a6" text-anchor="middle" font-size="9">dab deploy -t dev → registers dashboard + Genie Agent</text>

  <!-- Arrow: Bundle 2 → Experience -->
  <line x1="320" y1="300" x2="378" y2="300" stroke="#888" stroke-width="2" marker-end="url(#ah)"/>

  <!-- Experience box -->
  <rect x="380" y="240" width="300" height="120" rx="6" fill="#333" stroke="#888"/>
  <text x="530" y="262" fill="#fff" text-anchor="middle" font-weight="bold" font-size="11">Experience Layer</text>

  <rect x="395" y="275" width="130" height="30" rx="4" fill="#444" stroke="#0a6"/>
  <text x="460" y="295" fill="#0a6" text-anchor="middle" font-size="9">AI/BI Dashboard</text>

  <rect x="535" y="275" width="130" height="30" rx="4" fill="#444" stroke="#07a"/>
  <text x="600" y="295" fill="#07a" text-anchor="middle" font-size="9">Genie Agent</text>

  <rect x="620" y="310" width="50" height="18" rx="3" fill="#a06" stroke="#c08"/>
  <text x="645" y="323" fill="#fff" text-anchor="middle" font-size="8">ABAC</text>

  <text x="530" y="350" fill="#888" text-anchor="middle" font-size="8">Both query paratus.pha_pipeline tables</text>
</svg>