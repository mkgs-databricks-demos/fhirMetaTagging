  <!-- Part C2 -->
  <rect x="680" y="20" width="200" height="260" rx="6" fill="#a06" stroke="#c08"/>
  <text x="780" y="45" fill="#fff" text-anchor="middle" font-weight="bold" font-size="13">Part C2</text>
