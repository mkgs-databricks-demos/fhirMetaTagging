  <text x="30" y="106" fill="#ccc" font-size="9">Deployment History</text>
  <text x="30" y="122" fill="#ccc" font-size="9">Occupational Exposures</text>
  <text x="30" y="138" fill="#ccc" font-size="9">Women's Health</text>
  <text x="30" y="154" fill="#ccc" font-size="9">MHA Responses</text>
  <text x="30" y="174" fill="#888" font-size="8">Resources:</text>
  <text x="30" y="190" fill="#8bcae7" font-size="8">QuestionnaireResponse</text>
