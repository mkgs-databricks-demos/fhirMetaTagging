  <text x="690" y="246" fill="#8bcae7" font-size="8">Provenance</text>
  <text x="780" y="275" fill="#ffab00" text-anchor="middle" font-size="8">Tags: PART_C2, PROVIDER_APPROVED,</text>
  <text x="780" y="288" fill="#ffab00" text-anchor="middle" font-size="8">IMR_DETERMINANT, HITL_GATED</text>

  <!-- Bottom legend -->
  <text x="450" y="310" fill="#666" text-anchor="middle" font-size="9">DD Form 3024 — Periodic Health Assessment Workflow</text>
</svg>