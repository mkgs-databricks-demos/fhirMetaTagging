  <text x="555" y="275" fill="#ffab00" text-anchor="middle" font-size="8">Tags: PART_C1, AI_GENERATED, ADVISORY_ONLY</text>

  <!-- Arrow C1→C2 -->
  <line x1="650" y1="150" x2="678" y2="150" stroke="#888" stroke-width="2" marker-end="url(#ah)"/>
