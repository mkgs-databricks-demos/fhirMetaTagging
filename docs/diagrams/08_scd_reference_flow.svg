<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 280" font-family="Consolas, monospace" font-size="11">
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#888"/>
    </marker>
  </defs>
  <rect width="750" height="280" fill="#111" rx="8"/>

  <!-- Source files -->
  <rect x="20" y="30" width="130" height="80" rx="6" fill="#333" stroke="#ffab00"/>
  <text x="85" y="52" fill="#ffab00" text-anchor="middle" font-weight="bold" font-size="10">Landing Zone</text>
  <text x="85" y="72" fill="#ccc" text-anchor="middle" font-size="8">taxonomy.json v1.0</text>
  <text x="85" y="88" fill="#ccc" text-anchor="middle" font-size="8">taxonomy.json v1.1</text>
  <text x="85" y="104" fill="#888" text-anchor="middle" font-size="7">(file update triggers delta)</text>

  <line x1="150" y1="70" x2="188" y2="70" stroke="#ffab00" stroke-width="2" marker-end="url(#ah)"/>

  <!-- Bronze -->
  <rect x="190" y="45" width="120" height="50" rx="6" fill="#333" stroke="#077a9d"/>
  <text x="250" y="67" fill="#8bcae7" text-anchor="middle" font-size="9">bronze_taxonomy</text>
  <text x="250" y="82" fill="#888" text-anchor="middle" font-size="7">cloud_files ST</text>

  <line x1="310" y1="70" x2="348" y2="70" stroke="#077a9d" stroke-width="2" marker-end="url(#ah)"/>

  <!-- Staged -->
  <rect x="350" y="45" width="120" height="50" rx="6" fill="#333" stroke="#077a9d"/>
  <text x="410" y="67" fill="#8bcae7" text-anchor="middle" font-size="9">ref_taxonomy_staged</text>
  <text x="410" y="82" fill="#888" text-anchor="middle" font-size="7">exploded tags ST</text>

  <!-- SCD1 -->
  <line x1="470" y1="55" x2="528" y2="40" stroke="#0a6" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="530" y="20" width="180" height="45" rx="6" fill="#0a6" stroke="#0c8"/>
  <text x="620" y="40" fill="#fff" text-anchor="middle" font-weight="bold" font-size="10">ref_taxonomy_current</text>
  <text x="620" y="55" fill="#cfc" text-anchor="middle" font-size="8">SCD Type 1 — latest state only</text>

  <!-- SCD2 -->
  <line x1="470" y1="85" x2="528" y2="100" stroke="#07a" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="530" y="80" width="180" height="45" rx="6" fill="#07a" stroke="#09c"/>
  <text x="620" y="100" fill="#fff" text-anchor="middle" font-weight="bold" font-size="10">ref_taxonomy_history</text>
  <text x="620" y="115" fill="#adf" text-anchor="middle" font-size="8">SCD Type 2 — full version history</text>

  <!-- AUTO CDC label -->
  <text x="500" y="72" fill="#ffab00" font-size="8" font-weight="bold">AUTO CDC</text>
  <text x="500" y="82" fill="#ffab00" font-size="7">KEYS(tag_code)</text>

  <!-- Consumers -->
  <rect x="20" y="160" width="710" height="100" rx="6" fill="#1a1a2e" stroke="#444"/>
  <text x="375" y="180" fill="#888" text-anchor="middle" font-weight="bold" font-size="10">CONSUMERS</text>

  <line x1="620" y1="65" x2="200" y2="195" stroke="#0a6" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="40" y="195" width="300" height="45" rx="4" fill="#333" stroke="#0a6"/>
  <text x="190" y="215" fill="#0a6" text-anchor="middle" font-size="9">Gold join — uses SCD1 current state</text>
  <text x="190" y="230" fill="#888" text-anchor="middle" font-size="8">gold_tagged_resources JOIN ref_taxonomy_current</text>

  <line x1="620" y1="125" x2="560" y2="195" stroke="#07a" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="390" y="195" width="320" height="45" rx="4" fill="#333" stroke="#07a"/>
  <text x="550" y="215" fill="#07a" text-anchor="middle" font-size="9">Audit queries — uses SCD2 history</text>
  <text x="550" y="230" fill="#888" text-anchor="middle" font-size="8">"What tags under taxonomy v1.0?" → __START_AT / __END_AT</text>
</svg>