<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" font-family="Consolas, monospace" font-size="10">
  <rect width="700" height="500" fill="#111" rx="8"/>

  <!-- Phase labels -->
  <rect x="20" y="15" width="660" height="25" rx="4" fill="#07a" fill-opacity="0.3" stroke="#07a"/>
  <text x="350" y="32" fill="#07a" text-anchor="middle" font-weight="bold" font-size="11">Phase 1: Infrastructure (Bundle 1 — paratus-pha-pipeline)</text>

  <!-- Steps -->
  <rect x="30" y="50" width="30" height="20" rx="3" fill="#07a"/><text x="45" y="64" fill="#fff" text-anchor="middle" font-size="9">1</text>
  <text x="70" y="64" fill="#ccc" font-size="9">Run 00_explore.py — validate assumptions against reference files</text>

  <rect x="30" y="80" width="30" height="20" rx="3" fill="#07a"/><text x="45" y="94" fill="#fff" text-anchor="middle" font-size="9">2</text>
  <text x="70" y="94" fill="#ccc" font-size="9">dab deploy -t dev on Bundle 1 → creates schema, volumes, pipeline, notebooks</text>

  <rect x="30" y="110" width="30" height="20" rx="3" fill="#07a"/><text x="45" y="124" fill="#fff" text-anchor="middle" font-size="9">3</text>
  <text x="70" y="124" fill="#ccc" font-size="9">Drop CDP files into /Volumes/paratus/pha_pipeline/landing/</text>

  <rect x="30" y="140" width="30" height="20" rx="3" fill="#07a"/><text x="45" y="154" fill="#fff" text-anchor="middle" font-size="9">4</text>
  <text x="70" y="154" fill="#ccc" font-size="9">Run or trigger SDP pipeline → Bronze → Silver → Gold → MVs</text>

  <rect x="30" y="170" width="30" height="20" rx="3" fill="#07a"/><text x="45" y="184" fill="#fff" text-anchor="middle" font-size="9">5</text>
  <text x="70" y="184" fill="#ccc" font-size="9">Run 01_abac_setup.sql → governed tags + ABAC policies</text>

  <rect x="30" y="200" width="30" height="20" rx="3" fill="#07a"/><text x="45" y="214" fill="#fff" text-anchor="middle" font-size="9">6</text>
  <text x="70" y="214" fill="#ccc" font-size="9">Verify: SELECT COUNT(DISTINCT bundle_id) = 305</text>

  <!-- Phase 2 -->
  <rect x="20" y="245" width="660" height="25" rx="4" fill="#0a6" fill-opacity="0.3" stroke="#0a6"/>
  <text x="350" y="262" fill="#0a6" text-anchor="middle" font-weight="bold" font-size="11">Phase 2: Experience Layer (Bundle 2 — paratus-pha-experience)</text>

  <rect x="30" y="280" width="30" height="20" rx="3" fill="#0a6"/><text x="45" y="294" fill="#fff" text-anchor="middle" font-size="9">7</text>
  <text x="70" y="294" fill="#ccc" font-size="9">dab deploy -t dev on Bundle 2 → registers dashboard + Genie Agent (tables exist)</text>

  <rect x="30" y="310" width="30" height="20" rx="3" fill="#0a6"/><text x="45" y="324" fill="#fff" text-anchor="middle" font-size="9">8</text>
  <text x="70" y="324" fill="#ccc" font-size="9">Open Dashboard — verify KPIs, tag distribution, conformance rules</text>

  <rect x="30" y="340" width="30" height="20" rx="3" fill="#0a6"/><text x="45" y="354" fill="#fff" text-anchor="middle" font-size="9">9</text>
  <text x="70" y="354" fill="#ccc" font-size="9">Open Genie Agent — test sample questions (clinical + governance)</text>

  <rect x="30" y="370" width="30" height="20" rx="3" fill="#0a6"/><text x="45" y="384" fill="#fff" text-anchor="middle" font-size="9">10</text>
  <text x="70" y="384" fill="#ccc" font-size="9">Run 02_ndjson_write.py → produce tier1_output.ndjson + tier2_output.ndjson</text>

  <!-- Demo -->
  <rect x="20" y="405" width="660" height="25" rx="4" fill="#a06" fill-opacity="0.3" stroke="#a06"/>
  <text x="350" y="422" fill="#a06" text-anchor="middle" font-weight="bold" font-size="11">Demo Day</text>

  <rect x="30" y="440" width="30" height="20" rx="3" fill="#a06"/><text x="45" y="454" fill="#fff" text-anchor="middle" font-size="9">11</text>
  <text x="70" y="454" fill="#ccc" font-size="9">Narrate one core record end-to-end with dashboard + Genie Agent open</text>

  <text x="70" y="478" fill="#888" font-size="8">Submit Tier 1 + Tier 2 ndjson files via email to POC</text>
</svg>