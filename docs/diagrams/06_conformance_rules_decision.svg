<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 450" font-family="Consolas, monospace" font-size="11">
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#888"/>
    </marker>
  </defs>
  <rect width="750" height="450" fill="#111" rx="8"/>

  <!-- Rule 1 -->
  <rect x="20" y="20" width="220" height="180" rx="6" fill="#1a1a2e" stroke="#077a9d"/>
  <text x="130" y="42" fill="#077a9d" text-anchor="middle" font-weight="bold" font-size="12">Rule 1: AI→Provider Chain</text>

  <rect x="40" y="55" width="180" height="25" rx="4" fill="#333" stroke="#666"/>
  <text x="130" y="72" fill="#ccc" text-anchor="middle" font-size="9">AI_GENERATED + IMR_DETERMINANT?</text>

  <text x="80" y="100" fill="#0a6" font-size="9">No → PASS</text>
  <text x="140" y="100" fill="#888" font-size="9">Yes ↓</text>

  <rect x="40" y="110" width="180" height="25" rx="4" fill="#333" stroke="#666"/>
  <text x="130" y="127" fill="#ccc" text-anchor="middle" font-size="9">PROVIDER_APPROVED in Bundle?</text>

  <rect x="40" y="150" width="80" height="22" rx="4" fill="#0a6" stroke="#0c8"/>
  <text x="80" y="165" fill="#fff" text-anchor="middle" font-size="9">Yes → PASS</text>

  <rect x="140" y="150" width="80" height="22" rx="4" fill="#c00" stroke="#f33"/>
  <text x="180" y="165" fill="#fff" text-anchor="middle" font-size="9">No → FAIL</text>

  <text x="130" y="195" fill="#077a9d" text-anchor="middle" font-size="8">is_ai_provider_chain_valid</text>

  <!-- Rule 2 -->
  <rect x="265" y="20" width="220" height="180" rx="6" fill="#1a1a2e" stroke="#0a6"/>
  <text x="375" y="42" fill="#0a6" text-anchor="middle" font-weight="bold" font-size="12">Rule 2: Sensitivity Placement</text>

  <rect x="285" y="55" width="180" height="25" rx="4" fill="#333" stroke="#666"/>
  <text x="375" y="72" fill="#ccc" text-anchor="middle" font-size="9">PHI_CLINICAL or PII_SENSITIVE?</text>

  <text x="325" y="100" fill="#0a6" font-size="9">No → PASS</text>
  <text x="385" y="100" fill="#888" font-size="9">Yes ↓</text>

  <rect x="285" y="110" width="180" height="25" rx="4" fill="#333" stroke="#666"/>
  <text x="375" y="127" fill="#ccc" text-anchor="middle" font-size="9">element_id matched in dictionary?</text>

  <rect x="285" y="150" width="80" height="22" rx="4" fill="#0a6" stroke="#0c8"/>
  <text x="325" y="165" fill="#fff" text-anchor="middle" font-size="9">Yes → PASS</text>

  <rect x="385" y="150" width="80" height="22" rx="4" fill="#c00" stroke="#f33"/>
  <text x="425" y="165" fill="#fff" text-anchor="middle" font-size="9">No → FAIL</text>

  <text x="375" y="195" fill="#0a6" text-anchor="middle" font-size="8">is_sensitivity_placement_valid</text>

  <!-- Rule 3 -->
  <rect x="510" y="20" width="220" height="180" rx="6" fill="#1a1a2e" stroke="#a06"/>
  <text x="620" y="42" fill="#a06" text-anchor="middle" font-weight="bold" font-size="12">Rule 3: HITL_GATED Complete</text>

  <rect x="530" y="55" width="180" height="25" rx="4" fill="#333" stroke="#666"/>
  <text x="620" y="72" fill="#ccc" text-anchor="middle" font-size="9">All HITL_GATED elements present?</text>

  <text x="570" y="100" fill="#888" font-size="9">Count actual vs expected</text>

  <rect x="530" y="110" width="180" height="25" rx="4" fill="#333" stroke="#666"/>
  <text x="620" y="127" fill="#ccc" text-anchor="middle" font-size="9">actual >= expected?</text>

  <rect x="530" y="150" width="80" height="22" rx="4" fill="#0a6" stroke="#0c8"/>
  <text x="570" y="165" fill="#fff" text-anchor="middle" font-size="9">Yes → PASS</text>

  <rect x="630" y="150" width="80" height="22" rx="4" fill="#c00" stroke="#f33"/>
  <text x="670" y="165" fill="#fff" text-anchor="middle" font-size="9">No → FAIL</text>

  <text x="620" y="195" fill="#a06" text-anchor="middle" font-size="8">is_hitl_complete</text>

  <!-- Implementation note -->
  <rect x="20" y="220" width="710" height="80" rx="6" fill="#1a1a2e" stroke="#444"/>
  <text x="375" y="242" fill="#888" text-anchor="middle" font-weight="bold" font-size="10">Implementation: Pre-Computed Booleans (no subqueries in expectations)</text>
  <text x="30" y="262" fill="#ccc" font-size="9">• All three rules resolve as boolean columns in the Gold SELECT via joins to reference MVs</text>
  <text x="30" y="278" fill="#ccc" font-size="9">• Expectations are trivial: CONSTRAINT rule1_valid EXPECT (is_ai_provider_chain_valid)</text>
  <text x="30" y="294" fill="#ccc" font-size="9">• Bundle-level checks (Rules 1, 3) pre-computed in mv_bundle_flags, joined to gold_validated_resources</text>

  <!-- Source -->
  <text x="375" y="320" fill="#666" text-anchor="middle" font-size="8">Source: Phase 2 Instructions PDF, Step 5 paragraph 3 — tagging-taxonomy.json conformance rules</text>
</svg>